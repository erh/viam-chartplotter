name: viam_chartplotter_mobile
description: "Phase 0 spike: native Flutter chartplotter on Viam's SDK."
publish_to: "none"
version: 0.0.1

environment:
  sdk: ">=3.4.0 <4.0.0"
  # >=3.27 required: viam_sdk's flutter_webrtc uses the newer engine
  # SurfaceProducer API (onSurfaceAvailable), which older Flutter lacks.
  flutter: ">=3.27.0"

dependencies:
  flutter:
    sdk: flutter
  # Viam Flutter SDK — boat (RobotClient/WebRTC) + cloud (app/data) access.
  viam_sdk: ^0.19.0
  # Leaflet-style map: reuses the Go server's XYZ raster tiles directly.
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  # app.viam.com login: OAuth 2.0 + PKCE via the system browser, then feed the
  # access token to Viam.withAccessToken. Tokens kept in the platform keystore.
  flutter_appauth: ^8.0.0
  flutter_secure_storage: ^9.2.2
  # Plain HTTP for the weather JSON grid (tiles go through flutter_map).
  http: ^1.2.0
  # Persisted map/tool state (J6): view, base layer, orientation, safe depth.
  shared_preferences: ^2.3.0
  # App version+build for the tile cache-buster (A3).
  package_info_plus: ^8.0.0
  # Device-GPS fallback when the boat's fix is missing/stale (L5).
  geolocator: ^13.0.0
  # GPX export hands the file to the platform share sheet (E4) — the mobile
  # equivalent of the web download, and how a route gets onto a Garmin.
  share_plus: ^10.0.0
  # Tile disk cache (L1): SHA-1 keys + the platform cache directory. Both
  # were already transitive; promoted because lib/ imports them directly.
  crypto: ^3.0.0
  path_provider: ^2.1.0
  # Helm mode (L4): keep the screen awake while the chart is up.
  wakelock_plus: ^1.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
